# Keeps the free Render instance awake so the first visitor doesn't wait for a cold start.
# Render's free plan sleeps after 15 minutes without traffic; this pings the health check
# roughly every 10 minutes. GitHub may delay scheduled runs, and disables them after
# 60 days without repository activity (re-enable from the Actions tab).
name: keep-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://masr-party.onrender.com/api/health
